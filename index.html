<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кнопка перехода в Telegram</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: transparent !important;
      background-color: transparent !important;
      border: none !important;
      outline: none !important;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    .btn-wrapper {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 20px 16px 24px 16px;
      text-align: center;
      background: transparent !important;
      border: none !important;
      outline: none !important;
    }

    .tg-guide-btn {
      display: inline-block;
      width: 100%;
      max-width: 100%;
      background-color: #DB8341;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 21px;
      font-weight: 500;
      text-decoration: none;
      padding: 22px 28px;
      border: none !important;
      outline: none !important;
      border-radius: 12px;
      line-height: 1.35;
      box-shadow: 0 8px 20px rgba(219, 131, 65, 0.32), 0 2px 6px rgba(0, 0, 0, 0.16);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                  background-color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .tg-guide-btn:hover {
      transform: translateY(-3px);
      background-color: #E38D4B;
      box-shadow: 0 14px 26px rgba(219, 131, 65, 0.42), 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .tg-guide-btn:active {
      transform: translateY(1px) scale(0.98);
      background-color: #C97435;
      box-shadow: 0 4px 12px rgba(219, 131, 65, 0.25), 0 1px 3px rgba(0, 0, 0, 0.14);
    }
  </style>
</head>
<body>
  <div class="btn-wrapper">
    <a href="https://t.me/domikrd_bot?start=guide" target="_blank" rel="noopener noreferrer" class="tg-guide-btn">
      ЗАБРАТЬ ГАЙД
    </a>
  </div>
</body>
</html>
